<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111416">
  <link rel="stylesheet" href="style.css">
  <title></title>
</head>
<body>
  <main class="instrument" aria-label="Eight pad drum instrument">
    <div class="rail rail-a"></div>
    <section class="panel">
      <div class="accent accent-a"></div>
      <div class="pads">
        <button class="pad" data-voice="0" aria-label="Kick"></button>
        <button class="pad" data-voice="1" aria-label="Snare"></button>
        <button class="pad" data-voice="2" aria-label="Low tom"></button>
        <button class="pad" data-voice="3" aria-label="High tom"></button>
        <button class="pad" data-voice="4" aria-label="Closed hat"></button>
        <button class="pad" data-voice="5" aria-label="Open hat"></button>
        <button class="pad" data-voice="6" aria-label="Cowbell"></button>
        <button class="pad" data-voice="7" aria-label="Rimshot"></button>
      </div>
      <div class="accent accent-b"></div>
    </section>
    <div class="rail rail-b"></div>
    <button id="audioUnlock" class="audio-unlock" aria-label="Enable audio"><span></span></button>
  </main>
  <script src="main.js"></script>
  <script src="crispydrums.js"></script>
</body>
</html>
